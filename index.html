*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700}.logo span{color:#ffb703}
header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:16px}
main{padding:14px}
h3{margin-bottom:10px;color:var(--pd)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.in,select{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;font:inherit;background:#fff}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}

.banner{background:linear-gradient(135deg,var(--o),#f48c06);color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.banner h2{font-size:20px;line-height:1.3}.banner p{font-size:12px;opacity:.9;margin-top:4px}.banner span{font-size:46px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chips button{border:1px solid var(--b);background:#fff;padding:6px 14px;border-radius:20px;font:inherit;font-size:12px;white-space:nowrap}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:3px}
.em{position:relative;height:100px;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,var(--lg),#fff8e9);border-radius:10px;overflow:hidden}.em img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card h4{font-size:14px;margin-top:4px}.meta,.sub{font-size:11px;color:var(--m)}.sub{font-size:13px;padding:8px 0}
.card .btn{margin-top:auto}
.up{border:2px dashed var(--o);background:#fff8e9;border-radius:12px;padding:10px}
.pv{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0;font-size:20px;display:flex;flex-direction:column;align-items:center;color:var(--m)}
nav small{font-size:11px;font-family:inherit}nav button.on{color:var(--p);font-weight:700}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.md.on{display:flex}.box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.box img{width:100%;border-radius:12px}
.adm{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;max-width:480px;margin:0 auto}
.adm.on{display:flex}.ah{background:var(--pd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--b)}

/* ---------- compress photo ---------- */
function compress(file,mx=1100,ql=.7){return new Promise((res,rej)=>{let r=new FileReader();r.onerror=rej;r.onload=()=>{let im=new Image();im.onerror=rej;im.onload=()=>{let k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",ql))};im.src=r.result};r.readAsDataURL(file)})}
function prev(inp,id){let f=inp.files[0],i=$(id);if(!f){i.style.display="none";return}i.src=URL.createObjectURL(f);i.style.display="block"}
async function photo(id){let f=$(id).files[0];if(!f){toast("कॉन्ट्रैक्ट की फोटो डालें।");return null}
 try{let u=await compress(f);if(u.length>900000){toast("फोटो बहुत बड़ी है, कम साइज़ की लें।");return null}return u}catch(e){toast("फोटो पढ़ नहीं पाए, दूसरी चुनें।");return null}}
